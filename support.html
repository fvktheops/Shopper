<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Support — LUVORA</title>
  <style>
    :root{--maxw:1100px;--muted:#98a0b3;--card:#0f1724}
    body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial;color:#e6eef8;background:linear-gradient(180deg,#061029 0%,#081226 60%)}
    .container{max-width:var(--maxw);margin:28px auto;padding:20px}
    .card{background:var(--card);padding:16px;border-radius:10px;border:1px solid rgba(255,255,255,0.03)}
  </style>
</head>
<body>
  <header style="padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.03)"><div style="max-width:var(--maxw);margin:0 auto">LUVORA</div></header>
  <main class="container"><div class="card"><h1>Support</h1><p class="muted">For help, open an issue in the repository or contact the instance administrator.</p></div></main>
  <footer style="text-align:center;color:var(--muted);padding:18px">© LUVORA</footer>
</body>
</html>
