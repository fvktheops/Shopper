version: '3.8'

services:
  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis-data:/data

  ml-service:
    build: ./ml-service
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ML_DATA_DIR=/data
    ports:
      - "8001:8000" # Exposed for local test: http://localhost:8001
    depends_on:
      - redis
    volumes:
      - ml-data:/data

  ml-worker:
    build: ./worker
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ML_DATA_DIR=/data
    depends_on:
      - redis
    volumes:
      - ml-data:/data

volumes:
  redis-data:
  ml-data:
