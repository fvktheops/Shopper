# Update to docker-compose to include learner service
version: '3.8'

services:
  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis-data:/data

  ml-service:
    build: ./ml-service
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ML_DATA_DIR=/data
      - SENTENCE_MODEL=all-MiniLM-L6-v2
    ports:
      - "8001:8000"
    depends_on:
      - redis
    volumes:
      - ml-data:/data

  ml-worker:
    build: ./worker
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ML_DATA_DIR=/data
      - SENTENCE_MODEL=all-MiniLM-L6-v2
    depends_on:
      - redis
    volumes:
      - ml-data:/data

  ml-learner:
    build: ./worker
    restart: unless-stopped
    command: ["python","learner.py"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ML_DATA_DIR=/data
      - SENTENCE_MODEL=all-MiniLM-L6-v2
      - CLUSTER_SIM_THRESHOLD=0.75
    depends_on:
      - redis
    volumes:
      - ml-data:/data

volumes:
  redis-data:
  ml-data:
