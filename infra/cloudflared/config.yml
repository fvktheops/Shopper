# Cloudflared Tunnel example configuration
# Place under infra/cloudflared/config.yml and run with cloudflared tunnel --config /path/to/config.yml run

# Replace <TUNNEL_ID> and <YOUR_DOMAIN> with your values

tunnel: <TUNNEL_ID>
credentials-file: /home/cloudflared/.cloudflared/<TUNNEL_ID>.json

ingress:
  - hostname: ml.example.com
    service: http://localhost:8001
  - hostname: api.example.com
    service: http://localhost:4000
  - hostname: localhost
    service: http_status:404

# for more: https://developers.cloudflare.com/cloudflare-one/connections/connect-apps/
