user  nginx; # minimal nginx.conf template
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # upstreams - adjust hostnames/ports to your docker compose or host mapping
    upstream ml_service {
        server ml-service:8000; # container name and internal port
    }
    upstream socket_proxy {
        server socket-proxy:4002;
    }
    upstream api_backend {
        server api:4000; # replace with your backend service name and port
    }

    server {
        listen 80;
        server_name _;

        # Static files served by nginx (optional)
        location /static/ {
            root /var/www/html;
            try_files $uri $uri/ =404;
        }

        # Proxy ML service
        location /ml/ {
            proxy_pass http://ml_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # Proxy websocket/socket server
        location /socket.io/ {
            proxy_pass http://socket_proxy/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Proxy API backend
        location /api/ {
            proxy_pass http://api_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # Git HTTP - serve repositories (replace with actual git-http-backend socket or path)
        location ~ ^/repos/(.*)\.git(/.*)?$ {
            # pass to git-http-backend via FastCGI or a dedicated handler; this is a placeholder
            # To enable: configure git-http-backend and proxy to it here.
            proxy_pass http://api_backend/; # fallback
        }

        # Fallback to index.html for SPA
        location / {
            root /var/www/html;
            try_files $uri /index.html;
        }
    }
}
