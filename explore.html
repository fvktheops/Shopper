<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Explore — LUVORA</title>
  <meta name="description" content="Explore repositories on LUVORA" />
  <style>
    :root{--bg:#0b1220;--card:#0f1724;--accent:#ff4d72;--muted:#98a0b3;--maxw:1100px}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial;color:#e6eef8;background:linear-gradient(180deg,#061029 0%,#081226 60%)}
    header,footer{padding:12px 16px}
    .container{max-width:var(--maxw);margin:28px auto;padding:20px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
    .repo{background:var(--card);padding:16px;border-radius:10px;border:1px solid rgba(255,255,255,0.03)}
    .muted{color:var(--muted)}
  </style>
</head>
<body>
  <header>
    <div style="max-width:var(--maxw);margin:0 auto;display:flex;justify-content:space-between;align-items:center">
      <a href="/">LUVORA</a>
      <nav style="display:flex;gap:12px;color:var(--muted)"><a href="/explore">Explore</a><a href="/docs">Docs</a><a href="/login">Sign in</a></nav>
    </div>
  </header>

  <main class="container">
    <h1>Explore repositories</h1>
    <p class="muted">Public repositories on your LUVORA instance</p>
    <div id="list" class="grid" style="margin-top:16px"></div>
  </main>

  <footer style="text-align:center;color:var(--muted);padding:18px">© LUVORA</footer>

  <script>
    async function loadRepos(){
      try{
        const res = await fetch('/api/repos');
        const data = await res.json();
        const el = document.getElementById('list');
        if(!Array.isArray(data)) return el.innerHTML = '<div class="muted">No repositories found</div>';
        el.innerHTML = data.map(r => `\n          <a class="repo" href="/app?repo=${encodeURIComponent(r.owner+'/'+r.name)}">\n            <div style=\"font-weight:800\">${r.owner}/${r.name}</div>\n            <div style=\"color:var(--muted);margin-top:8px;font-size:13px\">${r.visibility} • Created</div>\n          </a>\n        `).join('\n');
      }catch(e){ console.error(e); document.getElementById('list').innerHTML = '<div class="muted">Failed to load</div>'; }
    }
    loadRepos();
  </script>
</body>
</html>
