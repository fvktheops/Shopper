<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign up — LUVORA</title>
  <meta name="description" content="Create an account on LUVORA" />
  <style>
    :root{--bg:#0b1220;--card:#0f1724;--accent:#ff4d72;--muted:#98a0b3;--glass:rgba(255,255,255,0.04);--maxw:1100px}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial;color:#e6eef8;background:linear-gradient(180deg,#061029 0%,#081226 60%);-webkit-font-smoothing:antialiased}
    header{padding:12px 16px;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);border-bottom:1px solid rgba(255,255,255,0.03)}
    .header-inner{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;justify-content:space-between}
    .brand{font-weight:800;color:white;text-decoration:none}
    .nav{display:flex;gap:12px;align-items:center}
    .nav a{color:var(--muted);text-decoration:none}

    .container{max-width:900px;margin:36px auto;padding:20px}
    .card{background:var(--card);padding:22px;border-radius:10px;border:1px solid var(--glass)}
    h1{margin-top:0}
    form{display:grid;gap:12px}

    label{font-size:13px;color:var(--muted)}
    input{padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit}
    button{background:var(--accent);color:white;padding:10px;border-radius:8px;border:none;font-weight:700}
    .muted{color:var(--muted);font-size:13px}
    @media(max-width:600px){.container{margin:18px 12px;padding:16px}}
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="/">LUVORA</a>
      <nav class="nav">
        <a href="/explore">Explore</a>
        <a href="/docs">Docs</a>
        <a href="/login">Sign in</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <h1>Create your account</h1>
      <p class="muted">Join LUVORA to create repositories, raise issues, and collaborate in real time.</p>

      <form id="signupForm">
        <div>
          <label for="username">Username</label>
          <input id="username" name="username" required autocomplete="username" />
        </div>
        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required autocomplete="email" />
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required autocomplete="new-password" />
        </div>
        <div>
          <button type="submit">Create account</button>
        </div>
      </form>

      <p class="muted" style="margin-top:12px">Already have an account? <a href="/login">Sign in</a></p>
    </div>
  </main>

  <footer style="text-align:center;color:var(--muted);padding:24px 0">© LUVORA</footer>

  <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Registration failed');
        alert('Account created — you are signed in');
        window.location.href = '/app';
      } catch (err) {
        alert(err.message);
      }
    });
  </script>
</body>
</html>
