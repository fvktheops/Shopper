<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LUVORA — Demo SPA with ML Panel</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;background:#071025;color:#e6eef8;margin:0;padding:20px}
    .card{background:#0f1724;padding:16px;border-radius:8px;border:1px solid rgba(255,255,255,0.03)}
    .btn-cta{background:#ff4d72;color:white;border:0;padding:8px 12px;border-radius:8px}
  </style>
</head>
<body>
  <header style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h1 style="margin:0">LUVORA (Demo)</h1>
    <nav>
      <a href="/" style="color:#9aa6bf;margin-right:12px">Home</a>
      <a href="/app" style="color:#9aa6bf">Dashboard</a>
    </nav>
  </header>

  <main>
    <section class="card" style="max-width:900px;margin:0 auto">
      <h2>ML Suggestions Panel</h2>
      <p class="muted-small">Use the panel below to run semantic retrieval against indexed repository files.</p>
      <div id="ml-panel-root" style="margin-top:12px"></div>
    </section>
  </main>

  <!-- Include ML panel script -->
  <script src="/static/js/ml-panel.js"></script>
  <script>if(window.mountMlPanel){mountMlPanel(document.getElementById('ml-panel-root'))}</script>
</body>
</html>
